site_name: 📓 My Notes
site_description: Personal programming notes and cheatsheets
site_author: Tanim

theme:
  name: material

  palette:
    - scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

    - scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

  font:
    text: Roboto
    code: Roboto Mono

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

markdown_extensions:

  # Admonitions
  - admonition

  # Code highlighting
  - pymdownx.highlight:
      anchor_linenums: true

  # Fenced code blocks
  - pymdownx.superfences

  # Clickable tabs
  - pymdownx.tabbed:
      alternate_style: true

  # Collapsible sections
  - pymdownx.details

  # Tables
  - tables

  # HTML attributes
  - attr_list

  # Markdown inside HTML
  - md_in_html

  # Math / LaTeX
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

